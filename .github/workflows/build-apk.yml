name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # O debug.keystore está no .gitignore; geramos um em tempo de build
      # (credenciais iguais às definidas em app/build.gradle.kts)
      - name: Gerar debug keystore
        run: >
          keytool -genkeypair -v
          -keystore debug.keystore
          -storepass android -keypass android
          -alias androiddebugkey -keyalg RSA -keysize 2048
          -validity 10000
          -dname "CN=Android Debug,O=Android,C=US"

      - name: Compilar APK de debug
        run: gradle assembleDebug --stacktrace

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-lixo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
